  <p class="foot">題目與政黨立場是將各次選舉主要議題簡化而成，可能與實際黨意・表決不同。1969–1989年增補・增額選舉不計未改選的1948年委員，只計算改選席次，僑選名額依實際固定。無黨籍視為一個整體計算。選區地圖是讀取所提供選舉地圖（maps/original）的標籤辨識各選區後再刪除標籤，地圖上的分配為推估。</p>
